<html lang="en">
<head>

<title>Name the Scorers</title>

<style>
/* Layout: one match card at a time — teams face each other across the score boxes, scorer blanks open beneath each side */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --fg:#17201b; --muted:#5d6a62; --line:#d6ded6;
  --accent:#1f6b3f; --accent-fg:#ffffff; --accent-soft:#e3efe6;
  --good:#1f7a43; --good-soft:#dff0e5; --bad:#b3362c; --bad-soft:#f7e2df; --warn:#9a6a00;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#161e19; --fg:#e7ede8; --muted:#93a198; --line:#2a352e;
  --accent:#5fc287; --accent-fg:#0f1512; --accent-soft:#1c2b22;
  --good:#6fd496; --good-soft:#173322; --bad:#f08a80; --bad-soft:#3a1d1a; --warn:#e8b54a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#161e19; --fg:#e7ede8; --muted:#93a198; --line:#2a352e;
  --accent:#5fc287; --accent-fg:#0f1512; --accent-soft:#1c2b22;
  --good:#6fd496; --good-soft:#173322; --bad:#f08a80; --bad-soft:#3a1d1a; --warn:#e8b54a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,44px);line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em}
.sub{color:var(--muted);margin:4px 0 0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.tally{display:flex;gap:18px;font-family:var(--display);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;font-size:15px}
.tally b{display:block;color:var(--fg);font-size:26px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mode{all:unset;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:4px}
.mode:hover{border-color:var(--accent)}
.mode:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mode h2{margin:0;font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;color:var(--accent)}
.mode p{margin:0;color:var(--muted)}
.mode small{color:var(--fg);font-weight:600}
.rules{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--muted);font-size:14px}
.rules b{color:var(--fg)}
.rules ul{margin:6px 0 0;padding-left:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:16px}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-size:15px}
.meta span{color:var(--muted);font-weight:600}
.face{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.team{font-family:var(--display);font-weight:800;font-size:clamp(20px,5vw,30px);line-height:1.05;text-transform:uppercase;min-width:0;overflow-wrap:anywhere}
.team.h{text-align:right}
.tag{display:block;font-family:var(--body);font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--muted)}
.score{display:flex;align-items:center;gap:6px}
.score input{width:52px;height:56px;text-align:center;font-family:var(--display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;padding:0}
.dash{font-family:var(--display);font-size:28px;font-weight:800;color:var(--muted)}
input{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.side{display:flex;flex-direction:column;gap:6px;min-width:0}
.side h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);font-style:italic}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;cursor:pointer;border-radius:8px;padding:10px 18px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:transparent;border-color:var(--line);color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.res{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.final{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase}
.final .s{background:var(--fg);color:var(--bg);border-radius:4px;padding:0 12px;font-size:26px;font-variant-numeric:tabular-nums}
.sc{display:flex;flex-direction:column;gap:3px;font-size:14px}
.sc.h{text-align:right;align-items:flex-end}
.chip{display:inline-flex;gap:6px;align-items:baseline;border-radius:4px;padding:1px 7px;max-width:100%}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.miss{background:var(--bad-soft);color:var(--bad)}
.chip .m{color:var(--muted);font-size:12px}
.wrong{font-size:13px;color:var(--muted)}
.wrong s{color:var(--bad)}
.pts{display:grid;grid-template-columns:1fr auto;gap:2px 16px;font-size:14px;background:var(--accent-soft);border-radius:8px;padding:10px 12px}
.pts b{font-variant-numeric:tabular-nums;text-align:right}
.pts .tot{font-family:var(--display);font-size:20px;font-weight:800;text-transform:uppercase;border-top:1px solid var(--line);padding-top:4px;margin-top:2px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.hist{display:flex;flex-direction:column;font-size:13px}
.hist div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.hist span:first-child{color:var(--muted);font-variant-numeric:tabular-nums}
.hist b{font-variant-numeric:tabular-nums}
.sect{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-size:15px;margin:0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--warn)}
@media (max-width:520px){.sides{grid-template-columns:1fr}.sc.h{text-align:left;align-items:flex-start}.score input{width:44px;height:50px;font-size:26px}.card{padding:14px}}
@media (prefers-reduced-motion:no-preference){.res{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>

/* ---------- name matching: full name, forgiving ---------- */
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z\s'-]/g,'').replace(/['-]/g,' ').replace(/\s+/g,' ').trim();
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}

function nameMatch(input,official){

const P={exact:5,result:2,scorer:2,bonus:3};
const sign=(h,a)=>Math.sign(h-a);
function grade(m,gh,ga,hin,ain){
  const out={exact:0,result:0,scorers:0,bonus:0,sides:[]};
  if(gh===m[3]&&ga===m[4])out.exact=P.exact;else if(sign(gh,ga)===sign(m[3],m[4]))out.result=P.result;
  let found=0,total=0;
  [[m[6],hin],[m[7],ain]].forEach(([official,inputs])=>{
    const hit=new Set(),wrong=[];
    inputs.filter(x=>norm(x)).forEach(x=>{
      const k=official.findIndex((o,i)=>!hit.has(i)&&nameMatch(x,o[0]));
      if(k>=0)hit.add(k);else if(!official.some((o,i)=>hit.has(i)&&nameMatch(x,o[0])))wrong.push(x);

  });
  out.scorers=found*P.scorer;out.found=found;out.total=total;
  if(total>0&&found===total)out.bonus=P.bonus;
  out.sum=out.exact+out.result+out.scorers+out.bonus;
  out.max=P.exact+total*P.scorer+(total?P.bonus:0);

}
function start(mode){
  S=store.get(KEY[mode]);
  if(!S||!S.order||S.order.length!==D.length)newRun(mode);
  if(S.mode==='random'&&S.pos>=D.length){S.order=shuffle(S.order);S.pos=0;save()}
  play();
}

function play(){
  tally();
  if(S.mode==='season'&&S.pos>=D.length)return finished();
  const m=D[S.order[S.pos]];
  let meta;
  if(S.mode==='season'){
    const gwRows=S.order.map(i=>D[i]).filter(r=>r[0]===m[0]);const k=gwRows.indexOf(m)+1;
    meta=`Gameweek ${m[0]} <span>Match ${k} of ${gwRows.length} · ${S.pos+1}/380</span>`;
  }else meta=`Gameweek ${m[0]} <span>${fmtD(m[1])}</span>`;
  $('#app').innerHTML=`
  <div class="card">
    <div class="meta">${meta}</div>
    ${S.mode==='season'?`<div class="bar"><i style="width:${(S.pos/D.length*100).toFixed(1)}%"></i></div>`:''}
    <div class="face">
      <div class="team h"><span class="tag">Home</span>${esc(m[2])}</div>
      <div class="score"><input id="gh" type="number" inputmode="numeric" min="0" max="15" aria-label="${esc(m[2])} goals"><span class="dash">–</span><input id="ga" type="number" inputmode="numeric" min="0" max="15" aria-label="${esc(m[5])} goals"></div>
      <div class="team"><span class="tag">Away</span>${esc(m[5])}</div>
    </div>
    <div class="sides">
      <div class="side"><h3>${esc(m[2])} scorers</h3><div id="hBox" class="side"></div></div>
      <div class="side"><h3>${esc(m[5])} scorers</h3><div id="aBox" class="side"></div></div>
    </div>
    <div class="row"><button class="btn" id="submit">Check answer</button><button class="btn quiet" id="menu">Change mode</button></div>
    <div id="out"></div>
  </div>
  ${history()}`;
  const blanks=(box,n,pre)=>{
    const el=$(box),old=[...el.querySelectorAll('input')].map(i=>i.value);
    if(!(n>0)){el.innerHTML=`<div class="hint">${n===0?'No scorers':'Enter the score to open blanks'}</div>`;return}
    el.innerHTML=Array.from({length:Math.min(n,10)},(_,i)=>`<input id="${pre}${i}" type="text" autocomplete="off" spellcheck="false" placeholder="Scorer ${i+1}" value="${esc(old[i]||'')}">`).join('');
  };
  const upd=()=>{const h=$('#gh').value,a=$('#ga').value;blanks('#hBox',h===''?NaN:+h,'hs');blanks('#aBox',a===''?NaN:+a,'as')};
  $('#gh').oninput=upd;$('#ga').oninput=upd;upd();
  $('#gh').focus();
  $('#submit').onclick=()=>check(m);
  $('#menu').onclick=home;
  $('#app').onkeydown=e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();($('#next')||$('#submit')).click()}};
}

function check(m){
  const gh=$('#gh').value,ga=$('#ga').value;
  if(gh===''||ga===''){$('#out').innerHTML='<p class="hint">Enter a score for both teams first.</p>';return}
  const hin=[...document.querySelectorAll('#hBox input')].map(i=>i.value),ain=[...document.querySelectorAll('#aBox input')].map(i=>i.value);
  const g=grade(m,+gh,+ga,hin,ain);
  S.points+=g.sum;S.max+=g.max;S.log.push([S.order[S.pos],g.sum,g.max]);S.pos++;save();tally();
  document.querySelectorAll('.card input').forEach(i=>i.disabled=true);$('#submit').disabled=true;
  const list=(official,side,cls)=>official.length?official.map((o,i)=>`<span class="chip ${side.hit.has(i)?'ok':'miss'}">${esc(o[0])} <span class="m">${o[1].join(', ')}</span></span>`).join(''):'<span class="hint">No goals</span>';
  const wrong=side=>side.wrong.length?`<div class="wrong">Not a scorer: ${side.wrong.map(w=>'<s>'+esc(w)+'</s>').join(', ')}</div>`:'';
  const lines=[];
  if(g.exact)lines.push(['Exact score',g.exact]);else if(g.result)lines.push(['Correct result',g.result]);else lines.push(['Score',0]);
  lines.push([`Scorers named (${g.found} of ${g.total})`,g.scorers]);
  if(g.bonus)lines.push(['Every scorer bonus',g.bonus]);
  let extra='';
  if(S.mode==='season'){const gw=m[0],gwLog=S.log.filter(l=>D[l[0]][0]===gw);const done=S.pos>=D.length||D[S.order[S.pos]][0]!==gw;
    extra=done?`<p class="sect">Gameweek ${gw} complete: ${gwLog.reduce((s,l)=>s+l[1],0)} of ${gwLog.reduce((s,l)=>s+l[2],0)} points</p>`:'';}
  $('#out').innerHTML=`<div class="res">
    <div class="final"><span>${esc(m[2])}</span><span class="s">${m[3]}–${m[4]}</span><span>${esc(m[5])}</span></div>
    <div class="sides"><div class="sc h">${list(m[6],g.sides[0])}${wrong(g.sides[0])}</div><div class="sc">${list(m[7],g.sides[1])}${wrong(g.sides[1])}</div></div>
    <div class="pts">${lines.map(l=>`<span>${l[0]}</span><b>+${l[1]}</b>`).join('')}<span class="tot">This match</span><b class="tot">${g.sum} / ${g.max}</b></div>
    ${extra}
    <div class="row"><button class="btn" id="next">${S.mode==='season'&&S.pos>=D.length?'See final total':'Next match'}</button></div>
  </div>`;
  $('#next').onclick=()=>{if(S.mode==='random'&&S.pos>=D.length){S.order=shuffle(S.order);S.pos=0;save()}play()};
  $('#next').focus();
}

function history(){
  if(!S.log.length)return'';
  const rows=S.log.slice(-8).reverse().map(([i,p,mx])=>{const m=D[i];return `<div><span>GW${m[0]}</span><span>${esc(m[2])} ${m[3]}–${m[4]} ${esc(m[5])}</span><b>${p}/${mx}</b></div>`}).join('');
  return `<div class="hist"><p class="sect">Recent matches</p>${rows}</div>
  <div id="resetBox"><button class="btn quiet" id="reset">Reset ${S.mode==='season'?'season':'random'} progress</button></div>`;
}
document.addEventListener('click',e=>{
  if(e.target.id==='reset'){$('#resetBox').innerHTML=`<div class="confirm">Erase ${S.log.length} played matches and ${S.points} points? <button class="btn" id="resetYes">Erase</button><button class="btn quiet" id="resetNo">Keep</button></div>`}
  else if(e.target.id==='resetYes'){store.del(KEY[S.mode]);newRun(S.mode);play()}
  else if(e.target.id==='resetNo'){play()}
});

function finished(){
  const per={};S.log.forEach(([i,p,mx])=>{const g=D[i][0];per[g]=per[g]||[0,0];per[g][0]+=p;per[g][1]+=mx});
  const best=Object.entries(per).sort((a,b)=>b[1][0]/b[1][1]-a[1][0]/a[1][1])[0];
  $('#app').innerHTML=`<div class="card">
    <div class="meta">Season complete <span>380 matches</span></div>
    <div class="final"><span class="s">${S.points} / ${S.max}</span></div>
    <p style="margin:0;text-align:center;color:var(--muted)">That's ${(S.points/S.max*100).toFixed(1)}% of available points. Best week: Gameweek ${best[0]} (${best[1][0]}/${best[1][1]}).</p>
    <div class="hist">${Object.entries(per).map(([g,[p,mx]])=>`<div><span>GW${g}</span><span><span class="bar" style="display:block;margin-top:6px"><i style="width:${(p/mx*100).toFixed(0)}%"></i></span></span><b>${p}/${mx}</b></div>`).join('')}</div>
    <div class="row"><button class="btn" id="again">Play the season again</button><button class="btn quiet" id="menu2">Change mode</button></div>
  </div>`;
  $('#again').onclick=()=>{newRun('season');play()};$('#menu2').onclick=home;
}
home();
</script>
</body>
</html>
